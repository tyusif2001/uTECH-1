<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10121b">
  <title>Contact — A little moment of wonder</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap');
    :root { color-scheme: dark; --ink: #f5f2ff; --muted: #b8b4c9; --gold: #f7d28b; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 90px 18px 72px; color: var(--ink); font-family: 'DM Sans', sans-serif; background: radial-gradient(ellipse at 50% 44%, #292342 0%, #171826 45%, #10121b 78%); }
    body::before { content: ''; position: fixed; inset: 0; pointer-events: none; opacity: .38; background-image: radial-gradient(1px 1px at 8% 18%, #fff 99%, transparent), radial-gradient(1.5px 1.5px at 83% 24%, #f7d28b 99%, transparent), radial-gradient(1px 1px at 26% 76%, #fff 99%, transparent), radial-gradient(1px 1px at 72% 84%, #fff 99%, transparent), radial-gradient(1px 1px at 94% 63%, #fff 99%, transparent), radial-gradient(1px 1px at 15% 53%, #f7d28b 99%, transparent); background-size: 320px 280px; }
    .site-nav { position: fixed; z-index: 2; top: 22px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; padding: 7px; border: 1px solid rgba(255,255,255,.12); border-radius: 999px; background: rgba(16,18,27,.58); backdrop-filter: blur(12px); }
    .site-nav a { padding: 9px 15px; border-radius: 999px; color: var(--muted); text-decoration: none; font-size: 12px; font-weight: 600; transition: .2s ease; }
    .site-nav a:hover, .site-nav a[aria-current="page"] { color: var(--ink); background: rgba(255,255,255,.1); }
    .card { position: relative; width: min(760px, 100%); padding: clamp(34px, 7vw, 68px); text-align: center; border: 1px solid rgba(255,255,255,.13); border-radius: 28px; background: linear-gradient(145deg, rgba(255,255,255,.075), rgba(255,255,255,.025)); box-shadow: 0 35px 100px rgba(0,0,0,.38), inset 0 1px rgba(255,255,255,.08); backdrop-filter: blur(14px); animation: arrive .8s cubic-bezier(.2,.8,.2,1) both; }
    .eyebrow { display: inline-flex; align-items: center; gap: 10px; color: var(--gold); font-size: 11px; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; }
    .eyebrow::before, .eyebrow::after { content: ''; width: 24px; height: 1px; background: currentColor; opacity: .7; }
    h1 { margin: 20px 0 14px; font-family: 'Playfair Display', Georgia, serif; font-size: clamp(48px, 9vw, 78px); font-weight: 500; letter-spacing: -.045em; line-height: 1.05; }
    h1 span { color: var(--gold); font-style: italic; }
    .rule { width: 42px; height: 2px; margin: 25px auto; background: linear-gradient(90deg, transparent, var(--gold), transparent); }
    p { max-width: 560px; margin: 0 auto 16px; color: var(--muted); font-size: 16px; line-height: 1.8; }
    .detail { display: inline-block; margin-top: 10px; padding: 15px 20px; border: 1px solid rgba(247,210,139,.3); border-radius: 14px; color: var(--gold); text-decoration: none; transition: .2s ease; }
    .detail:hover { background: rgba(247,210,139,.09); transform: translateY(-2px); }
    footer { position: fixed; bottom: 24px; color: rgba(245,242,255,.42); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; }
    @keyframes arrive { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <nav class="site-nav" aria-label="Main navigation">
    <a href="hello-world.html">Home</a>
    <a href="about.html">About</a>
    <a href="contact.html" aria-current="page">Contact</a>
  </nav>
  <main class="card">
    <div class="eyebrow">We’d love to hear from you</div>
    <h1>Say <span>hello.</span></h1>
    <div class="rule" aria-hidden="true"></div>
    <p>Have a question, a bright idea, or just want to say hi? Send a note and let’s start a conversation.</p>
    <a class="detail" href="mailto:hello@example.com">✉ &nbsp; hello@example.com</a>
    <p style="margin-top:20px;font-size:13px">Replace this sample address with your own email to receive messages.</p>
  </main>
  <footer>Made for the joy of beginning</footer>
</body>
</html>
